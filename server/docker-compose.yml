version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: mapapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  tegola:
    image: go-spatial/tegola:latest
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/etc/tegola/config.toml
    depends_on:
      - postgres

volumes:
  postgres_data:
